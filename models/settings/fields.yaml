    client_id:
        label: ladylain.microsoftlogin::lang.settings.client_id
        comment: ladylain.microsoftlogin::lang.settings.client_id_comment
        span: right

    auth_method:
        label: ladylain.microsoftlogin::lang.settings.auth_method
        type: radio
        span: full

    client_secret:
        label: ladylain.microsoftlogin::lang.settings.client_secret
        comment: ladylain.microsoftlogin::lang.settings.client_secret_comment
