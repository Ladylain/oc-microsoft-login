        type: partial
        path: $/ladylain/microsoftlogin/partials/_settings_guide.htm

    enabled:
        label: ladylain.microsoftlogin::lang.settings.enabled
        comment: ladylain.microsoftlogin::lang.settings.enabled_comment
        type: switch

    _app_section:
        label: ladylain.microsoftlogin::lang.settings.app_section
        type: section

    tenant_id:
        label: ladylain.microsoftlogin::lang.settings.tenant_id
        comment: ladylain.microsoftlogin::lang.settings.tenant_id_comment
