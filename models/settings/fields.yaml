            action: show
            field: auth_method
            condition: value[secret]

    cert_path:
        label: ladylain.microsoftlogin::lang.settings.cert_path
        comment: ladylain.microsoftlogin::lang.settings.cert_path_comment
        span: left
        trigger:
            action: show
            field: auth_method
            condition: value[certificate]

    cert_pub_path:
        label: ladylain.microsoftlogin::lang.settings.cert_pub_path
        comment: ladylain.microsoftlogin::lang.settings.cert_pub_path_comment
        span: right
        trigger:
            action: show
            field: auth_method
            condition: value[certificate]

    _display_section:
        label: ladylain.microsoftlogin::lang.settings.display_section
        type: section

    button_label:
        label: ladylain.microsoftlogin::lang.settings.button_label
        comment: ladylain.microsoftlogin::lang.settings.button_label_comment
        span: left
